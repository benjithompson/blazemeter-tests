# Runs the Digital Bank login with the password from a BlazeMeter secret.
# The password is not in this file or in the JMX. See README.md.
execution:
- executor: jmeter
  concurrency: 1
  ramp-up: 10s
  hold-for: 1m
  scenario: dbank-login
  secrets:
  - dbank_password

scenarios:
  dbank-login:
    script: dbank-login-secrets.jmx
