execution:
- executor: jmeter
  scenario: CreateUser
  iterations: 10
  concurrency: 1

scenarios:
  CreateUser:
    follow-redirects: true
    data-sources:
    - path: users.csv
      variable-names: emailAddress, firstName, lastName, postalCode
    variables:
      BASE_URL: http://192.168.29.208:8888/bank
    requests:
      - url: '${BASE_URL}/api/v1/auth?username=admin@demo.io&password=Demo123!'
        method: POST
        label: 1. Authenticate API User
        headers:
          Content-Type: application/json
        assert:
          - contains:
            - '200'
          subject: http-code
          regexp: true 
          assume-success: true 
        extract-jsonpath:
          authToken: 'authToken'
      - url: '${BASE_URL}/api/v1/user?role=USER'
        method: POST
        label: 2. Create User
        headers:
          Authorization: Bearer ${authToken}
          Content-Type: application/json
        body:
        assertion:
          - contains:
            - '201'
            subject: http-code
            regexp: true 
            assume-success: true 