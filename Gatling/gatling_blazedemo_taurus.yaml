
# Script generated by Blazemeter Chrome Extension

execution:
  - executor: gatling
    concurrency: 5
    ramp-up: 30s
    hold-for: 2m
    scenario: BlazeDemo-Travel-Gatling
scenarios:
  BlazeDemo-Travel-Gatling:
    default-address: https://blazedemo.com
    requests:
    - url: /
      method: GET
      label: https://www.blazedemo.com/
      headers: {}
    - url: /reserve.php
      method: POST
      label: https://www.blazedemo.com/reserve.php
      headers:
        Content-Type: application/x-www-form-urlencoded
      body:
        fromPort: Paris
        toPort: Buenos Aires
    - url: /purchase.php
      method: POST
      label: https://www.blazedemo.com/purchase.php
      headers:
        Content-Type: application/x-www-form-urlencoded
      body:
        airline: Virgin America
        flight: '43'
        fromPort: Paris
        price: '472.56'
        toPort: Buenos Aires
    - url: /confirmation.php
      method: POST
      label: https://www.blazedemo.com/confirmation.php
      headers:
        Content-Type: application/x-www-form-urlencoded
      body:
        _token: ''
        address: 123 main st
        cardType: visa
        city: Seattle
        creditCardMonth: '11'
        creditCardNumber: '1234123412341234'
        creditCardYear: '2017'
        inputName: john
        nameOnCard: John Smith
        state: WA
        zipCode: '12345'
